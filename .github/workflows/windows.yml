name: Windows

on:
  workflow_call:
    inputs:
      build_type:
        type: string
        default: Debug
      version:
        type: string
      devel:
        type: string
        default: "true"

jobs:
  build:
    name: "Windows ${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: amd64
            msystem: ucrt64
          - os: windows-11-arm
            arch: aarch64
            msystem: clangarm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup
        uses: ./.github/workflows/setup
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          version: ${{ inputs.version }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git
          pacboy: >-
            toolchain:p cmake:p extra-cmake-modules:p ninja:p 7zip:p
            qt6-base:p qt6-svg:p
            qt6-imageformats:p qt6-charts:p
            ccache:p
            quazip-qt6:p
            nsis:u

      - name: Put MSYS2 location in env
        shell: bash
        run: echo "MSYS2_LOCATION=${{ steps.msys2.outputs.msys2-location }}" >> "$GITHUB_ENV"

      - name: Build
        uses: ./.github/workflows/build
        with:
          build_type: ${{ inputs.build_type }}
          shell: msys2 {0}
          devel: ${{ inputs.devel }}
